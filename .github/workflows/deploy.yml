name: Auto-Deploy VOKAL to cPanel Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to vokal.org.in
    runs-on: ubuntu-latest

    steps:
      - name: 🚀 Trigger cPanel Git Pull & Deploy
        run: |
          echo "Step 1: Pulling latest code from GitHub to cPanel server..."
          curl -s --insecure -X POST \
            "https://lin31.plreseller.com:2083/execute/VersionControl/update" \
            -H "Authorization: cpanel vokalorg:${{ secrets.CPANEL_API_TOKEN }}" \
            --data "repository_root=/home/vokalorg/vokal-website"

          echo "Waiting 5 seconds..."
          sleep 5

          echo "Step 2: Running .cpanel.yml deploy tasks..."
          curl -s --insecure -X POST \
            "https://lin31.plreseller.com:2083/execute/VersionControlDeployment/create" \
            -H "Authorization: cpanel vokalorg:${{ secrets.CPANEL_API_TOKEN }}" \
            --data "repository_root=/home/vokalorg/vokal-website"

          echo "✅ Deployment triggered successfully!"
